<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ARES DIGITAL - Editor Dashboard</title>
<link rel="icon" href="https://aresdigital.store/cdn/shop/files/ARES_DIGITAL_LOGO_TP.png?v=1717417198&width=60">
<style>
  :root{ --red:#ff0000; --orange:#ff9500; --bg:#0a0a0a; --panel:#1a1a1a; --panel2:#2a2a2a; --green:#00ff00; --txt:#c0c0c0; --mut:#808080; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); color:var(--txt); padding:20px; }

  .header{ display:flex; align-items:center; gap:26px; margin-bottom:26px; padding:20px; background:linear-gradient(135deg,#1a1a1a 0%,#0a0a0a 100%); border-left:4px solid var(--red); }
  .header img.logo{ width:90px; height:90px; object-fit:contain; }
  .header-text h1{ color:#fff; font-size:30px; font-weight:700; margin-bottom:5px; letter-spacing:.02em; }
  .header-text p{ color:var(--mut); font-size:15px; text-transform:uppercase; letter-spacing:2px; }
  #status{ margin-left:auto; color:var(--mut); font-size:13px; align-self:flex-start; }

  .tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
  .tab{ background:var(--panel); border:1px solid var(--panel2); color:#fff; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:600; letter-spacing:.02em; }
  .tab .n{ color:var(--red); margin-left:8px; font-weight:700; }
  .tab.active{ background:var(--red); border-color:var(--red); }
  .tab.active .n{ color:#fff; }

  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; margin-bottom:26px; }
  .stat-card{ background:var(--panel); padding:22px; border-radius:8px; border-top:3px solid var(--red); transition:all .2s; cursor:pointer; position:relative; }
  .stat-card:hover{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,0,0,.3); }
  .stat-card.active{ background:var(--panel2); box-shadow:0 4px 16px rgba(255,0,0,.5); }
  .stat-card.active::after{ content:"FILTERING"; position:absolute; top:10px; right:10px; font-size:10px; color:var(--red); font-weight:700; letter-spacing:1px; }
  .stat-card.hl{ border-top-color:var(--green); }
  .stat-card.exp{ border-top-color:var(--red); background:linear-gradient(135deg,#1a1a1a 0%,#2a0000 100%); }
  .stat-card.done{ border-top-color:var(--green); background:linear-gradient(135deg,#1a1a1a 0%,#002a00 100%); }
  .stat-value{ font-size:44px; font-weight:700; color:#fff; margin-bottom:6px; }
  .stat-label{ font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; }

  .filter-info{ background:var(--panel); padding:14px 20px; border-radius:6px; margin-bottom:18px; border-left:3px solid var(--red); display:flex; justify-content:space-between; align-items:center; }
  .filter-info.hidden{ display:none; }
  .clear-filter{ background:var(--red); color:#fff; border:0; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  .clear-filter:hover{ background:#cc0000; transform:scale(1.05); }

  .sort-controls{ background:var(--panel); padding:14px 20px; border-radius:6px; margin-bottom:26px; display:flex; gap:20px; align-items:center; }
  .sort-group{ display:flex; align-items:center; gap:10px; }
  .sort-group label{ color:var(--mut); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
  .sort-group select{ background:var(--bg); color:var(--txt); border:2px solid var(--panel2); padding:8px 12px; border-radius:4px; font-size:14px; cursor:pointer; min-width:220px; }
  .sort-group select:hover{ border-color:var(--red); }
  .sort-group select:focus{ outline:none; border-color:var(--red); box-shadow:0 0 8px rgba(255,0,0,.3); }

  .section{ margin-bottom:28px; }
  .section-header{ font-size:18px; font-weight:600; color:#fff; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--panel2); text-transform:uppercase; letter-spacing:1px; }
  .section-header.same{ color:var(--red); border-bottom-color:var(--red); }
  .section-header.exp{ color:var(--orange); border-bottom-color:var(--orange); }
  .section-header.done{ color:var(--green); border-bottom-color:var(--green); }
  .orders-list{ display:grid; gap:12px; }
  .empty{ color:var(--mut); padding:16px 2px; font-size:14px; }

  .order-card{ background:var(--panel); padding:16px 20px; border-radius:6px; display:grid; grid-template-columns:40px minmax(180px,1.7fr) 140px minmax(140px,1fr) minmax(190px,1.4fr) 104px 118px; gap:14px; align-items:center; border-left:3px solid var(--panel2); transition:background .2s; }
  .order-card:hover{ background:#222; }
  .order-card.same{ background:linear-gradient(90deg,#2a0000 0%,#1a1a1a 100%); border-left-color:var(--red); }
  .order-card.exp{ background:linear-gradient(90deg,#2a1600 0%,#1a1a1a 100%); border-left-color:var(--orange); }
  .order-card.done{ background:linear-gradient(90deg,#002a00 0%,#1a1a1a 100%); border-left-color:var(--green); opacity:.75; }
  .order-card.done .customer-name{ text-decoration:line-through; color:var(--mut); }
  .order-card.hidden{ display:none; }

  .checkbox-container{ display:flex; align-items:center; justify-content:center; }
  .checkbox{ width:24px; height:24px; cursor:pointer; -webkit-appearance:none; appearance:none; border:2px solid #404040; border-radius:4px; background:var(--panel); position:relative; transition:all .2s; }
  .checkbox:hover{ border-color:var(--green); background:var(--panel2); }
  .checkbox:checked{ background:var(--green); border-color:var(--green); }
  .checkbox:checked::after{ content:"\2713"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#000; font-weight:bold; font-size:16px; }

  .customer-name{ font-size:16px; font-weight:600; color:#fff; }
  .sub{ display:block; font-size:12px; color:var(--mut); font-weight:400; margin-top:3px; text-decoration:none; }
  .sub a{ color:var(--green); text-decoration:none; }
  .lifter-tag{ display:inline-block; background:var(--panel2); color:var(--red); padding:4px 10px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; text-align:center; min-width:120px; }
  .lifter-tag.unknown{ background:var(--panel); color:#404040; font-style:italic; }
  .package-type{ color:var(--txt); font-size:13px; }
  .package-type span{ display:block; }
  .package-type .add{ color:var(--mut); font-size:12px; }
  .badge{ padding:6px 10px; border-radius:4px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; text-align:center; min-width:96px; display:inline-block; }
  .badge.same{ background:var(--red); color:#fff; }
  .badge.exp{ background:var(--orange); color:#000; }
  .badge.standard{ background:var(--panel2); color:var(--mut); }
  .badge.hl{ background:var(--green); color:#000; }
  .badge.no-hl{ background:transparent; color:#404040; }
  .badge.view{ background:transparent; color:var(--green); border:1px solid var(--green); cursor:pointer; }
  .dl-input{ width:100%; padding:8px 10px; border-radius:4px; border:1px solid var(--panel2); background:#000; color:#fff; font-size:12px; }
  .dl-input:focus{ outline:none; border-color:var(--red); }
  .dl-input.bad{ border-color:#ff5c5c; }
  .dl-input:disabled{ opacity:.5; }
  .dl-err{ color:#ff5c5c; font-size:11px; margin-top:3px; }
  .dl-view{ color:var(--green); font-size:13px; text-decoration:none; }
  .dl-view:hover{ text-decoration:underline; }

  .gate{ max-width:340px; margin:14vh auto; text-align:center; color:#fff; }
  .gate input{ width:100%; padding:12px; margin:14px 0; border-radius:6px; border:1px solid var(--panel2); background:#000; color:#fff; font-size:16px; text-align:center; }
  .gate button{ background:var(--red); color:#fff; border:0; padding:12px 22px; border-radius:6px; font-weight:700; cursor:pointer; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:2rem; z-index:50; }
  .modal{ background:#111; border:1px solid var(--panel2); border-radius:8px; padding:26px; max-width:480px; width:100%; color:#fff; }
  .modal h2{ font-size:19px; margin-bottom:6px; }
  .modal .meta{ color:var(--mut); font-size:13px; margin-bottom:16px; }
  .modal p{ color:var(--txt); font-size:14px; margin-bottom:14px; line-height:1.5; }
  .modal input{ width:100%; padding:12px; border-radius:6px; border:1px solid var(--panel2); background:#000; color:#fff; font-size:15px; margin-bottom:6px; }
  .modal .err{ color:#ff5c5c; font-size:13px; min-height:18px; margin-bottom:8px; }
  .modal .row{ display:flex; gap:10px; margin-top:8px; }
  .modal .row button{ flex:1; padding:12px; border-radius:6px; font-weight:700; cursor:pointer; border:0; }
  .modal .cancel{ background:transparent; border:1px solid var(--panel2); color:#fff; }
  .modal .go{ background:var(--red); color:#fff; }
</style>
</head>
<body>

<div class="header">
  <img class="logo" src="https://aresdigital.store/cdn/shop/files/ARES_DIGITAL_LOGO_TP.png?v=1717417198&amp;width=240" alt="Ares Digital">
  <div class="header-text">
    <h1>ARES DIGITAL</h1>
    <p>Editor Order Dashboard</p>
  </div>
  <span id="status"></span>
</div>

<div class="gate" id="gate" style="display:none">
  <p>Enter the editor passcode.</p>
  <input id="pinInput" type="password" placeholder="Passcode" onkeydown="if(event.key==='Enter')enterPin()">
  <div class="err" id="gateErr" style="color:#ff5c5c;font-size:13px;min-height:18px;margin:6px 0"></div>
  <button onclick="enterPin()">Enter</button>
</div>

<div id="app" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div class="stats-grid" id="stats"></div>
  <div class="filter-info hidden" id="filterInfo">
    <div><strong style="color:var(--red)">FILTERED VIEW:</strong>
      <span id="filterText" style="color:#fff;margin-left:10px"></span></div>
    <button class="clear-filter" onclick="clearFilter()">Clear Filter</button>
  </div>
  <div class="sort-controls">
    <div class="sort-group">
      <label>Sort by:</label>
      <select id="sortSelect" onchange="applyView()">
        <option value="default">Default (Delivery Priority)</option>
        <option value="session-asc">Session (1 &#8594; up)</option>
        <option value="session-desc">Session (up &#8594; 1)</option>
        <option value="platform-asc">Platform (1 &#8594; up)</option>
        <option value="platform-desc">Platform (up &#8594; 1)</option>
        <option value="flight-asc">Flight (A &#8594; Z)</option>
        <option value="flight-desc">Flight (Z &#8594; A)</option>
        <option value="name-asc">Name (A &#8594; Z)</option>
        <option value="name-desc">Name (Z &#8594; A)</option>
        <option value="date-asc">Order date (oldest)</option>
        <option value="date-desc">Order date (newest)</option>
      </select>
    </div>
  </div>

  <div class="section" id="secSame">
    <div class="section-header same">&#128293; Same Day</div>
    <div class="orders-list" id="listSame"></div>
  </div>
  <div class="section" id="secExp">
    <div class="section-header exp">&#9889; Expedited (48 Hours)</div>
    <div class="orders-list" id="listExp"></div>
  </div>
  <div class="section" id="secStd">
    <div class="section-header">Standard Orders</div>
    <div class="orders-list" id="listStd"></div>
  </div>
  <div class="section" id="secDone">
    <div class="section-header done">&#10003; Completed</div>
    <div class="orders-list" id="listDone"></div>
  </div>
</div>

<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbxizZB_HrhRRxz_fClmGdqSUB2O8lGvYuOakZMyobL_oYocyU-fQxvNAMH59J8sQhfBcg/exec';
  var PIN = localStorage.getItem('ares_dash_pin') || '';
  var DATA=null, ACTIVE=null, FILTER=null, TIMER=null;

  function api(payload){
    return fetch(EXEC, { method:'POST', body: JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if(!d.ok) throw new Error(d.error||'Request failed'); return d; });
  }

  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(s){ if(!s) return ''; var d=new Date(s); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }
  function displayName(o){ return o.lifter || o.name; }
  function speedLabel(s){ return s===0?'Same Day':s===1?'Expedited':'Standard'; }
  function speedClass(s){ return s===0?'same':s===1?'exp':'standard'; }

  function showGate(msg){
    document.getElementById('app').style.display='none';
    document.getElementById('gate').style.display='';
    document.getElementById('gateErr').textContent=msg||'';
    document.getElementById('pinInput').focus();
  }
  function enterPin(){
    var pin=document.getElementById('pinInput').value.trim();
    if(!pin) return;
    document.getElementById('gateErr').textContent='Checking...';
    api({action:'data',pin:pin}).then(function(d){
      PIN=pin; localStorage.setItem('ares_dash_pin',pin);
      DATA=d; boot();
    }).catch(function(e){ document.getElementById('gateErr').textContent=e.message; });
  }
  function boot(){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='';
    document.getElementById('status').textContent='Updated '+new Date(DATA.generatedAt).toLocaleTimeString();
    render();
    if(TIMER) clearInterval(TIMER);
    TIMER=setInterval(load,120000);
  }

  function load(){
    document.getElementById('status').textContent='Refreshing...';
    api({action:'data',pin:PIN}).then(function(d){
      DATA=d;
      document.getElementById('status').textContent='Updated '+new Date(d.generatedAt).toLocaleTimeString();
      render();
    }).catch(function(e){
      if(/passcode/i.test(e.message)){ localStorage.removeItem('ares_dash_pin'); showGate(e.message); return; }
      document.getElementById('status').textContent='Error: '+e.message;
    });
  }

  function render(){
    var codes=Object.keys(DATA.meets).sort().reverse();
    if(!codes.length){ document.getElementById('tabs').innerHTML='<div class="empty">No paid orders yet.</div>'; return; }
    if(!ACTIVE||codes.indexOf(ACTIVE)<0) ACTIVE=codes[0];
    var t=document.getElementById('tabs'); t.innerHTML='';
    codes.forEach(function(c){
      var m=DATA.meets[c];
      var open=m.orders.filter(function(o){return !o.fulfilled;}).length;
      var b=document.createElement('button');
      b.className='tab'+(c===ACTIVE?' active':'');
      b.innerHTML=esc(m.name)+'<span class="n">'+open+'</span>';
      b.onclick=function(){ ACTIVE=c; FILTER=null; render(); };
      t.appendChild(b);
    });
    renderMeet();
  }

  function statCard(cls,val,label,onclick,active){
    var d=document.createElement('div');
    d.className='stat-card'+(cls?' '+cls:'')+(active?' active':'');
    d.innerHTML='<div class="stat-value">'+val+'</div><div class="stat-label">'+label+'</div>';
    d.onclick=onclick;
    return d;
  }

  function orderCard(o){
    var card=document.createElement('div');
    card.className='order-card'+(o.fulfilled?' done':(o.speed===0?' same':o.speed===1?' exp':''));

    var cbc=document.createElement('div'); cbc.className='checkbox-container';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.className='checkbox'; cb.checked=o.fulfilled;
    cb.onclick=function(e){
      e.preventDefault();
      if(o.fulfilled){ openDeliver(o); return; }
      var link=(card._dl.value||'').trim();
      if(!/^https?:\/\//i.test(link)){
        card._dl.classList.add('bad');
        card._dlerr.textContent='Paste the delivery link first';
        card._dl.focus();
        return;
      }
      cb.checked=true; cb.disabled=true; card._dl.disabled=true;
      card._dl.classList.remove('bad'); card._dlerr.textContent='Delivering...'; card._dlerr.style.color='var(--mut)';
      api({action:'deliver',pin:PIN,order:o,link:link}).then(function(){ load(); })
        .catch(function(err){
          cb.checked=false; cb.disabled=false; card._dl.disabled=false;
          card._dl.classList.add('bad'); card._dlerr.style.color=''; card._dlerr.textContent=err.message;
        });
    };
    cbc.appendChild(cb); card.appendChild(cbc);

    var who=document.createElement('div');
    var sub = o.lifter ? esc(o.name) : '';
    if(o.billing) sub += (sub?' &middot; ':'')+esc(o.billing);
    if(o.email) sub += (sub?' &middot; ':'')+esc(o.email);
    var extra='';
    if(o.fulfilled){
      extra='<span class="sub">Delivered '+fmtDate(o.deliveredDate)+
        (o.deliveredLink?' &middot; <a href="'+esc(o.deliveredLink)+'" target="_blank" rel="noopener">view media</a>':'')+'</span>';
    }
    who.innerHTML='<span class="customer-name">'+esc(displayName(o))+'</span>'+
      '<span class="sub">'+sub+'</span>'+extra;
    card.appendChild(who);

    var tag=document.createElement('span');
    if(o.roster){
      tag.className='lifter-tag';
      tag.textContent='S'+o.roster.session+', P'+o.roster.platform+', Flight '+o.roster.flight;
    } else { tag.className='lifter-tag unknown'; tag.textContent='roster n/a'; }
    card.appendChild(tag);

    var pkg=document.createElement('div'); pkg.className='package-type';
    pkg.innerHTML=o.items.map(function(i){
      var addon=/highlight/i.test(i.title);
      return '<span'+(addon?' class="add"':'')+'>'+esc(i.title)+'</span>';
    }).join('');
    card.appendChild(pkg);

    // delivery link column
    var dlc=document.createElement('div');
    if(o.fulfilled){
      dlc.innerHTML=o.deliveredLink
        ? '<a class="dl-view" href="'+esc(o.deliveredLink)+'" target="_blank" rel="noopener">view media</a>'
        : '<span style="color:#404040">&mdash;</span>';
    } else {
      var di=document.createElement('input');
      di.type='url'; di.className='dl-input'; di.placeholder='Paste delivery link';
      di.value=o.deliveredLink||'';
      di.onclick=function(e){ e.stopPropagation(); };
      di.oninput=function(){ di.classList.remove('bad'); derr.textContent=''; };
      var derr=document.createElement('div'); derr.className='dl-err';
      dlc.appendChild(di); dlc.appendChild(derr);
      card._dl=di; card._dlerr=derr;
    }
    card.appendChild(dlc);

    var hb=document.createElement('span');
    hb.className='badge '+(o.highlight?'hl':'no-hl');
    hb.innerHTML=o.highlight?'Highlight':'&mdash;';
    card.appendChild(hb);

    var db=document.createElement('span');
    db.className='badge '+speedClass(o.speed);
    db.textContent=speedLabel(o.speed);
    card.appendChild(db);

    return card;
  }

  function passFilter(o){
    if(!FILTER) return true;
    if(FILTER.type==='rush') return o.speed<=1 && !o.fulfilled;
    if(FILTER.type==='highlight') return o.highlight;
    if(FILTER.type==='completed') return o.fulfilled;
    return true;
  }

  function sortCmp(mode){
    var uf=function(o){ return o.roster?o.roster.flight:'ZZZ'; };
    var us=function(o){ return o.roster?Number(o.roster.session)||999:999; };
    var up=function(o){ return o.roster?Number(o.roster.platform)||999:999; };
    switch(mode){
      case 'session-asc': return function(a,b){ return us(a)-us(b); };
      case 'session-desc': return function(a,b){ return us(b)-us(a); };
      case 'platform-asc': return function(a,b){ return up(a)-up(b); };
      case 'platform-desc': return function(a,b){ return up(b)-up(a); };
      case 'flight-asc': return function(a,b){ return uf(a).localeCompare(uf(b)); };
      case 'flight-desc': return function(a,b){ return uf(b).localeCompare(uf(a)); };
      case 'name-asc': return function(a,b){ return displayName(a).localeCompare(displayName(b)); };
      case 'name-desc': return function(a,b){ return displayName(b).localeCompare(displayName(a)); };
      case 'date-asc': return function(a,b){ return new Date(a.createdAt)-new Date(b.createdAt); };
      case 'date-desc': return function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); };
      default: return function(a,b){ return a.speed-b.speed || new Date(a.createdAt)-new Date(b.createdAt); };
    }
  }

  function renderMeet(){
    var m=DATA.meets[ACTIVE]||{orders:[]};
    var orders=m.orders.slice();

    var total=orders.length;
    var rushN=orders.filter(function(o){return o.speed<=1 && !o.fulfilled;}).length;
    var hlN=orders.filter(function(o){return o.highlight;}).length;
    var doneN=orders.filter(function(o){return o.fulfilled;}).length;
    var s=document.getElementById('stats'); s.innerHTML='';
    s.appendChild(statCard('',total,'Total Orders',function(){ FILTER=null; renderMeet(); },false));
    s.appendChild(statCard('exp',rushN,'Rush (48 hrs)',function(){ FILTER={type:'rush',label:'Rush orders (Same Day + Expedited)'}; renderMeet(); },FILTER&&FILTER.type==='rush'));
    s.appendChild(statCard('hl',hlN,'Highlight Packages',function(){ FILTER={type:'highlight',label:'Orders with a Highlight Reel'}; renderMeet(); },FILTER&&FILTER.type==='highlight'));
    s.appendChild(statCard('done',doneN,'Completed',function(){ FILTER={type:'completed',label:'Completed (delivered) orders'}; renderMeet(); },FILTER&&FILTER.type==='completed'));

    var fi=document.getElementById('filterInfo');
    if(FILTER){ fi.classList.remove('hidden'); document.getElementById('filterText').textContent=FILTER.label; }
    else fi.classList.add('hidden');

    var visible=orders.filter(passFilter);
    var cmp=sortCmp(document.getElementById('sortSelect').value);
    var same=visible.filter(function(o){return !o.fulfilled && o.speed===0;}).sort(cmp);
    var expd=visible.filter(function(o){return !o.fulfilled && o.speed===1;}).sort(cmp);
    var std=visible.filter(function(o){return !o.fulfilled && o.speed>1;}).sort(cmp);
    var done=visible.filter(function(o){return o.fulfilled;}).sort(cmp);

    fill('listSame','secSame',same,'No same-day orders.');
    fill('listExp','secExp',expd,'No expedited orders.');
    fill('listStd','secStd',std,'No standard orders.');
    fill('listDone','secDone',done,'Nothing delivered yet.');
  }

  function fill(listId,secId,arr,emptyMsg){
    var list=document.getElementById(listId); list.innerHTML='';
    document.getElementById(secId).style.display = (FILTER && !arr.length) ? 'none' : '';
    if(!arr.length){ list.innerHTML='<div class="empty">'+emptyMsg+'</div>'; return; }
    arr.forEach(function(o){ list.appendChild(orderCard(o)); });
  }

  function applyView(){ renderMeet(); }
  function clearFilter(){ FILTER=null; renderMeet(); }

  function openDeliver(o){
    var resend=o.fulfilled;
    var ov=document.createElement('div'); ov.className='overlay';
    ov.innerHTML=
      '<div class="modal">'+
      '<h2>'+(resend?'Resend delivery':'Deliver order')+'</h2>'+
      '<div class="meta">'+esc(o.name)+' &middot; '+esc(displayName(o))+' &middot; '+esc(o.email||'no email')+'</div>'+
      '<p>Paste the finished media link (Frame.io, Drive, gallery). This marks the order <b>fulfilled in Shopify</b> and emails '+esc(o.email||'the customer')+' a branded delivery email from info@aresdigital.store. Delivery is blocked without a link.</p>'+
      '<input id="dl" type="url" placeholder="https://f.io/..." value="'+esc(o.deliveredLink||'')+'">'+
      '<div class="err" id="dlerr"></div>'+
      '<div class="row"><button class="cancel" id="dc">Cancel</button>'+
      '<button class="go" id="dg">'+(resend?'Resend email':'Deliver &amp; email')+'</button></div>'+
      '</div>';
    document.body.appendChild(ov);
    var input=ov.querySelector('#dl'); input.focus();
    ov.querySelector('#dc').onclick=function(){ ov.remove(); };
    ov.addEventListener('click',function(e){ if(e.target===ov) ov.remove(); });
    var g=ov.querySelector('#dg');
    g.onclick=function(){
      var link=input.value.trim();
      if(!/^https?:\/\//i.test(link)){ ov.querySelector('#dlerr').textContent='Enter a valid media link (must start with http).'; return; }
      g.disabled=true; g.textContent='Sending...';
      api({action:'deliver',pin:PIN,order:o,link:link}).then(function(){ ov.remove(); load(); })
        .catch(function(e){ g.disabled=false; g.textContent='Try again'; ov.querySelector('#dlerr').textContent=e.message; });
    };
  }

  if(PIN){
    api({action:'data',pin:PIN}).then(function(d){ DATA=d; boot(); })
      .catch(function(){ localStorage.removeItem('ares_dash_pin'); showGate(''); });
  } else {
    showGate('');
  }
</script>
</body>
</html>
